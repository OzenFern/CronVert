name: Release & Deploy

on:
  # Deploy when a version tag (v*) is pushed
  push:
    tags:
      - "v*"

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-progress deployment finish; queue the newest run behind it
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Deploy on manual dispatch, version tag push, or successful CI run on main
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # Get the repository contents at the commit that passed CI
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # Setup Vite+ (Node.js, dependencies, and cache)
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "lts"
          cache: true

      # Build the application for production
      - run: vp build

      # Configure GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v6

      # Upload the production build
      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      # Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      # Create a GitHub Release with automatically generated release notes
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --generate-notes \
            --title "CronVert ${{ github.ref_name }}"
