name: Deploy CronVert

# Trigger deployment on pushes to main
on:
  push:
    branches: [main]

  # Allow manual deployment
  workflow_dispatch:

# Permissions required for GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-progress deployment finish; queue the newest run behind it
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # Get the repository contents
      - name: Checkout repository
        uses: actions/checkout@v7

      # Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      # Install dependencies
      - name: Install dependencies
        run: npm ci

      # Build the React application
      - name: Build application
        run: npm run build

      # Configure GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v6

      # Upload the production build
      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      # Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
